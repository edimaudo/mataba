<!doctype html>
<html lang="en-CA" data-theme="light" data-font-size="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fa">
  <meta name="robots" content="noindex,follow">
  <title>Page not found | Mataba</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; --text:#1e2b3c; --muted:#586779; --surface:#fff; --canvas:#f3f6fa; --border:#e3e8ef; --blue:#2863c8; }
    html { font-size:1em; } html[data-font-size="small"]{font-size:.75em} html[data-font-size="medium"]{font-size:1em} html[data-font-size="large"]{font-size:1.25em}
    html[data-theme="dark"] { color-scheme:dark; --text:#e7edf5; --muted:#a0aec0; --surface:#18263a; --canvas:#111d2f; --border:#2b3b51; --blue:#91baff; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); background:var(--canvas); }
    main { width:min(100%,620px); border:1px solid var(--border); background:var(--surface); padding:clamp(25px,6vw,54px); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:750; letter-spacing:-.03em; }
    .mark { display:grid; place-items:center; width:36px; height:36px; border-radius:10px; background:#4c7fd5; color:#fff; font:800 1.4rem Georgia,serif; }
    .code { margin:44px 0 8px; color:var(--blue); font-size:.75rem; font-weight:700; letter-spacing:.13em; }
    h1 { margin:0; font-size:clamp(1.8rem,5vw,2.5rem); line-height:1.12; letter-spacing:-.05em; }
    p { color:var(--muted); line-height:1.7; max-width:480px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:27px; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:43px; padding:0 16px; border:1px solid var(--border); color:var(--text); text-decoration:none; font-size:.86rem; font-weight:650; }
    a.primary { color:#fff; background:#2863c8; border-color:#2863c8; }
    a:focus-visible { outline:3px solid #72a7ff; outline-offset:3px; }
  </style>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('mataba-theme');
        const size = localStorage.getItem('mataba-font-size');
        const language = localStorage.getItem('mataba-language') === 'fr' ? 'fr' : 'en';
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
        if (['small','medium','large'].includes(size)) document.documentElement.dataset.fontSize = size;
        document.documentElement.lang = language === 'fr' ? 'fr-CA' : 'en-CA';
        document.addEventListener('DOMContentLoaded', () => {
          document.querySelectorAll('[data-en][data-fr]').forEach((node) => { node.textContent = language === 'fr' ? node.dataset.fr : node.dataset.en; });
          document.title = language === 'fr' ? 'Page introuvable | Mataba' : 'Page not found | Mataba';
        });
      } catch (_) { /* Keep the static English fallback if storage is unavailable. */ }
    })();
  </script>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">m</span><span>Mataba</span></div>
    <p class="code">404</p>
    <h1 data-en="This page could not be found." data-fr="Cette page est introuvable.">This page could not be found.</h1>
    <p data-en="The address may be incorrect or the page may have moved. Use one of the links below to continue." data-fr="L’adresse est peut-être incorrecte ou la page a été déplacée. Utilisez l’un des liens ci-dessous pour continuer.">The address may be incorrect or the page may have moved. Use one of the links below to continue.</p>
    <div class="actions">
      <a class="primary" href="/" data-en="Return to Mataba" data-fr="Retourner à Mataba">Return to Mataba</a>
      <a href="/qa" data-en="Legal Q&A" data-fr="Questions juridiques">Legal Q&A</a>
    </div>
  </main>
</body>
</html>
